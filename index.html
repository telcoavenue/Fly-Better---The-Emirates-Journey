            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);

            display: inline-block;
            background-color: #d71921; /* Emirates Red */

            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;

            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 600;
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(215, 25, 33, 0.4);
        }

        .download-btn:hover {
            background: #b5131a;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(215, 25, 33, 0.6);
        }

        .download-btn:active {
            transform: translateY(-1px);
        }

        .file-info {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
